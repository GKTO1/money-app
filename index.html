<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Michel's Money</title>
<meta name="theme-color" content="#1f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone column; the safe-to-spend number first, a fast add form under the thumb, tabs pinned to the bottom. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#15211c; --muted:#5b6b64; --line:#d5ddd8;
  --cedar:#1f6b4f; --cedar-soft:#dcebe3; --tip:#b07a12; --tip-soft:#f6ecd6;
  --spend:#b5463a; --spend-soft:#f5e1de; --on-accent:#ffffff;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1714; --surface:#16211c; --ink:#e4ece8; --muted:#93a59d; --line:#27352f;
  --cedar:#5fc398; --cedar-soft:#1b3328; --tip:#e2b04f; --tip-soft:#352a14;
  --spend:#ec8a7d; --spend-soft:#3a1f1b; --on-accent:#0f1714; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:env(safe-area-inset-top,0px) 16px calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding-block:18px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:700}
h2{font:500 13px/1.3 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cedar);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0;flex:1}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{background:none;border:1px solid var(--line);border-radius:9px;width:36px;height:36px}
.monthnav button:disabled{opacity:.35}
.monthnav span{min-width:88px;text-align:center;font-weight:600}

.hero{display:flex;flex-direction:column;gap:6px}
.hero .label{color:var(--muted);font-size:13px}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(46px,14vw,66px);line-height:1;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--spend)}
.hero .perday{font-size:17px;font-weight:500}
.hero .perday b{font-family:var(--mono);font-weight:500}
.math{display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--line)}
.math div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.math span:first-child{color:var(--muted)}
.math span:last-child{font-family:var(--mono)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:10px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.14)}
.seg5{grid-template-columns:repeat(5,1fr)}
.seg5 button{padding:9px 2px;font-size:13px}
.toggle{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
.toggle[aria-pressed="true"]{border-style:solid;border-color:var(--tip);background:var(--tip-soft);color:var(--ink)}
.tag{display:inline-block;margin-left:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--tip-soft);color:var(--ink);vertical-align:1px}
.pace{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pace div,.invgrid div{display:flex;flex-direction:column;min-width:0}
.pace small,.invgrid small{color:var(--muted);font-size:12px}
.pace b,.invgrid b{font-family:var(--mono);font-weight:500;font-size:17px}
.inv{display:flex;flex-direction:column;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.invgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row{display:flex;gap:8px;align-items:flex-end}
.amount{font-family:var(--mono);font-size:24px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:600;background:var(--cedar);color:var(--on-accent);text-align:center;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--spend);color:var(--on-accent)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:9px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--line);background:none;border-radius:9px;padding:7px 11px;font-size:13px;color:var(--muted)}

.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paygrid small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.log{display:flex;flex-direction:column}
.day{font-size:12px;color:var(--muted);padding:10px 0 4px;letter-spacing:.05em;text-transform:uppercase}
.item{display:grid;grid-template-columns:8px 1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item .dot{width:8px;height:8px;border-radius:50%}
.item .what{min-width:0;overflow-wrap:anywhere}
.item .what small{display:block;color:var(--muted);font-size:12px}
.item .v{font-family:var(--mono)}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 8px;border-radius:7px}
.del.armed{background:var(--spend);color:var(--on-accent)}
.empty{color:var(--muted);font-size:14px}

.goal{display:grid;grid-template-columns:24px 1fr auto;gap:3px 10px;align-items:center;padding-block:4px}
.goal .step{grid-row:span 2;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);font:500 12px var(--mono);display:grid;place-items:center;color:var(--muted)}
.goal.done .step{background:var(--cedar);border-color:var(--cedar);color:var(--on-accent)}
.goal.now .step{border-color:var(--cedar);color:var(--cedar)}
.goal .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.goal .amt{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.goal .track{grid-column:2/4;height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.goal .track i{display:block;height:100%;background:var(--cedar)}
.goal .note{grid-column:2/4;font-size:12px;color:var(--muted)}
.goal .tools{grid-column:2/4;display:flex;gap:6px;margin-top:4px}
.iconbtn{border:1px solid var(--line);background:none;border-radius:8px;min-width:36px;height:32px;padding:0 9px;font-size:13px}
.iconbtn:disabled{opacity:.3}
.editor{border:1px solid var(--cedar);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.editor input,.editor select{background:var(--surface)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:none;font-size:12px}
.days button[aria-pressed="true"]{background:var(--cedar);border-color:var(--cedar);color:var(--on-accent)}
.rem{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0}
.rem .when{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--cedar)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s ease}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l2-3h12l2 3"/><circle cx="15.5" cy="13" r="1.4"/></svg>Today</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg>Goals</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Settings</button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
